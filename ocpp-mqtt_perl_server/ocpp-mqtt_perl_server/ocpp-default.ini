# Listen port[s] for OCPP client[s]:
#LISTEN0=9000
#LISTEN1=9001

# Maximum number of time to wait for a command (in seconds):
#WAITDATA_TIMEOUT=10

# Delay handling message in queue.

# Minimum time between messages:
#QUEUE_DELAY_TIME=30

# Minimum number of times "HandleQueue" function is called before sending a message
# (the time between calls is defined by WAITDATA_TIMEOUT parameter):
#QUEUE_WAIT=3

# Minimum number of times "HandleQueue" function is called before sending a message
# after boot notification:
#QUEUE_WAIT_BOOT=10

# Maximum number of entries in the queue, to limit bug-loops. Default 30:
#MAX_QUEUE=30

# Log parameters:
#LOG_FILENAME=ocpp.log
#LOG_SIZE=10_000_000
#LOG_VERSIONS=50
VERBOSE=11

# If specified, per-day meter and charging data will be saved in this subdir
DATADIR=
#DATADIR=data

# The transaction log file:
CHARGE_LOG=charge.log

# The charging hour detail log file, if specified:
HOUR_LOG=pv.log

# Base directory for checking custom commands:
#BASEDIR_CMD=/dev/shm/ocpp

# If round or not ZULU time (depends on your WallBox: ABB discards milliseconds)
ROUND_ZULU=1

# If the WallBox is not under the meter (e.g. meter measures only
# home load), set the following parameter to 1:
ADD_WALLBOX_POWER_TO_METER=0

# Maximum power, in Ampere:
MAXPOWER=32

# Minimum power allowed by charging protocol. You can raise this
# values if you want to avoid charging inefficiency. See also parameter
# "CHARGING_MINPOWER"
MINPOWER=6

# Try to keep the following minimum power when charging. Go below only when
# reaching grid limit. Limit could be expressed in Ampere or Watt.
#CHARGING_MINPOWER=10

# Maximum grid voltage: if it will be overtaken, increase (or start) charging
# in order to avoid Solar Inverter shutdown or power limiting.
#MAXVOLTAGE=250

# Minimum wallbox voltage: if it will be overtaken, decrease (or stop) charging
# in order to avoid too much energy waste.
#MINVOLTAGE=200


# For Watt=>Ampere conversion, if current voltage cannot be determined:
VOLT_AVG=230

WAIT_CHANGE=360s
WAIT_ON_START=10s

# If the wallbox does not have RFID reader and does not automatically start
# charging, enable AUTOSTART: RemoteStartTransaction will be sent when
# connector is plugged.
AUTOSTART=0

# If the car (EV) suspend the charge, wait the specified amount of time 
# before sending RemoteStopTransaction command. This to avoid energy waste:
# it seems for example that Tesla Model 3 drawns about 230W when in "suspended"
# state (connected to the WallBox and the WallBox still offering power).
# A value of 0 disables the feature.
#STOP_ON_SUSPENDEV=0:10
STOP_ON_SUSPENDEV=0

# Some wallboxes (such as Tridan V2C) do not like to set limit to 0 A.
# Use RemoteStopTransaction to suspend the charging.
USE_STOP_AS_SUSPEND=0

# If your Wallbox reports Energy.Active.Import.Register as absolute value from
# the installation, uncomment the following line. Energy will be made relative
# to the transaction.
#GLOBAL_ENERGY=1

# The Profile ID and Stack Level to be used on SetChargingProfile
CS_PROFILE_ID=2
CS_STACK_LEVEL=1

# Custom configuration keys to be set.
#
# Data to be returned from Wallbox periodic samples (if omitted, use Wallbox default):
CONFKEY=MeterValuesSampledData:Current.Import,Current.Offered,Energy.Active.Import.Register,Power.Active.Import,Voltage
# For Huawey or other wallbox that have more measurands. Adapt as needed:
#CONFKEY=MeterValuesSampledData:Current.Import,Current.Offered,Energy.Active.Import.Register,Power.Active.Import,Voltage,Frequency,Temperature,Power.Factor,Power.Offered
# Sampling interval of previous data:
CONFKEY=MeterValueSampleInterval:30
# Clock aligned interval of global energy values:
CONFKEY=ClockAlignedDataInterval:120
# Usually default clock aligned data is only Energy.Active.Import. Uncomment the following if you like to have other data (fields are the same as MeterValuesSampledData)
#CONFKEY=MeterValuesAlignedData:Energy.Active.Import.Register,Temperature,Voltage

# Set the following parameter to 1 if you want to get available configuration keys:
GETCONF=1

# Maximum energy to be erogated in the current session.
# If the limit is reached, the charging will be suspended.
# The energy could be expressed in Wh (in this case, it should be greater
# then 1000) or kWh (less then 1000). 0=unlimited
MAX_ENERGY_SESSION=0



########################
# Grid limit is in Watt.

# For 1.5 kW contract:
#GRID_LIMIT=2000
#GRID_LIMIT_SAFE=1650

# For 2 kW contract:
#GRID_LIMIT=2666
#GRID_LIMIT_SAFE=2200

# For 2.5 kW contract:
#GRID_LIMIT=3333
#GRID_LIMIT_SAFE=2750

# For 3 kW contract:
GRID_LIMIT=4000
GRID_LIMIT_SAFE=3300

# For 3.5 kW contract:
#GRID_LIMIT=4666
#GRID_LIMIT_SAFE=3850

# For 4.0 kW contract:
#GRID_LIMIT=5333
#GRID_LIMIT_SAFE=4400

# For 4.5 kW contract:
#GRID_LIMIT=6000
#GRID_LIMIT_SAFE=4950

# For 5.0 kW contract:
#GRID_LIMIT=6666
#GRID_LIMIT_SAFE=5500

# For 5.5 kW contract:
#GRID_LIMIT=7333
#GRID_LIMIT_SAFE=6050

# For 6.0 kW contract:
#GRID_LIMIT=8000
#GRID_LIMIT_SAFE=6600

# For 7 kW contract (3 phases):
#GRID_LIMIT=9800
#GRID_LIMIT_SAFE=7700

# For 8 kW contract (3 phases):
#GRID_LIMIT=11200
#GRID_LIMIT_SAFE=8800

# For 9 kW contract (3 phases):
#GRID_LIMIT=12600
#GRID_LIMIT_SAFE=9900

# For 10 kW contract (3 phases):
#GRID_LIMIT=14000
#GRID_LIMIT_SAFE=11000

# For 15 kW contract (3 phases):
#GRID_LIMIT=21000
#GRID_LIMIT_SAFE=16500

# Send an email if the meter will overtake the maximum grid power
# when not charging.
WARNMAIL=

# The safe limit should be 3300 for 3 kW, but limit a little bit less to be very safe
# since sampling is every 30 secs and you can miss a spike that could lead to
# miss the 3-hours counter reset. Use the following value to reduce the power
# while we are in "pause" timing. (if preceeded by "-" or "+", use relative value
# against GRID_LIMIT_SAFE)
GRID_LIMIT_SAFE_REDUCE=-50


# The maximum time you can overtake safe limit (you have 3:02 on Italian OpenMeter2).
# Maybe you can set a little bit lower to allow other loads to overtake the safe limit
# for some time.
GRID_LIMIT_MAXTIME=2:50

# The following time, when reached, causes the reduction of the power under the safe
# limit. If the new calculated power will be below the minimum power, the minimum
# power will be used until GRID_LIMIT_MAXTIME will be reached.
GRID_LIMIT_REDUCETIME=2:00

# Theoretical minimum pause is 18 minutes (9 minutes to switch from "Rischio Distacco"
# to "Riduci Carico", 9 minutes to let message disappear, 1 minute every 10 minutes
# you overtake the GRID_LIMIT_SAFE), but increase a little bit to be very safe.
# You can specify the limit in percentage of the previous "over safe power" time.
GRID_LIMIT_PAUSE=11.5%

# If you overtake the limit for a little bit while doing the pause, you don't have to 
# restart the pause counter, but only 10% of the time you overtake. The overtake
# could be maximum 36 seconds (so only 4 seconds of additional pause), but set here the 
# time to add to pause (default 1 minute)
GRID_LIMIT_RESTART_PAUSE=0:01:00

# If AVG=0, never exceed "FIXED", othewise try to make average for "FIXED" power,
# e.g. when the fixed should be reduced due to grid overload.
# This is mainly used for efficiency tests at various power.
AVG=0
# Maximum ampere deviation from AVG to start compensation
AVG_DEV=0.05

# Weight of "history" for average in power calculation, specified in seconds:
# new_value=(old_value*AVG_HISTORIC_SEC+cur_value*SEC_FROM_LAST)/(AVG_HISTORIC_SEC+SEC_FROM_LAST)
AVG_HISTORIC_SEC=900

# Weight of "history" for average after changing power/ampere (during "WAIT_CHANGE" period)
AVG_CHANGING_SEC=36

# If you don't have a meter, set the default base load of you house:
BASELOAD=1000


# You can specify days considered as Sunday (format MM/DD):
HOLIDAY=01/01	# Maria Madre di Dio / Capodanno
HOLIDAY=01/06	# Epifania
HOLIDAY=EASTER+1# Lunedi dell'Angelo
HOLIDAY=04/25	# Festa della Liberazione d'Italia
HOLIDAY=05/01	# Festa del lavoro
HOLIDAY=06/02	# Festa della Repubblica
HOLIDAY=08/15	# Assunzione di Maria
HOLIDAY=11/01	# Tutti i Santi
HOLIDAY=12/08	# Immacolata
HOLIDAY=12/25	# Natale
HOLIDAY=12/26	# S.Stefano

######## LIST OF TIME SLOT ##############
# User for peak/off-peak hours statistics
TIMESLOT=F1 => 08:00-19:00@1-5
TIMESLOT=F2 => 07:00-23:00@1-6
TIMESLOT=F3 => 00:00-24:00@0-6

######## LIST OF CARD ##############
# Set to 1 the following parameter if you want to restrict
# start charging only with defined cards.
ALLOW_ONLY_DEFINED_CARDS=1
# Could be used as substitute for TagID
CARD=CSOLAR  => 878E33E4 # Use only auto-produced solar energy [card]
CARD=SMART   => 3C6CB3BB # Charge when grid energy request is low or by full-solar [bluekey]
CARD=F123    => D26A39FD # Charge always at maximum power
CARD=F23     => 22684DFD # Charge in F2 and F3
CARD=F3      => A27F3AFD # Charge only in F3
CARD=CFIXED  => 72B43EFD # Charge always at a fixed rate (for testing)


############# MQTT Configuration ################
# Global enable of MQTT
MQTT_ENABLED=1

# You can specify a custom port (default 1883) appending a colon 
# and the port number to the broker server name.
MQTT_BROKER=localhost:1883

# Specify username and password, if required:
MQTT_USERNAME=
MQTT_PASSWORD=

# You can change unit of power/energy. By default, power expressed in Watt and energy expressed in kWh
# Please, keep attention that unit is case-sensitive (W or kW for power, Wh or kWh for energy).
#MQTT_POWER_UNIT=W
#MQTT_ENERGY_UNIT=kWh

# The topic prefix to be used by this ocpp server:
MQTT_TOPIC_PREFIX=ocpp

# The added base topic for general configuration:
MQTT_CONFIG_GENERAL_BASE=config/general

# The added base topic for charging profiles:
MQTT_CONFIG_PROFILE_BASE=config/profile

# The added base topic for grid profiles:
MQTT_CONFIG_GRID_BASE=config/grid

# The added base topic for baseload profiles:
MQTT_CONFIG_BASELOAD_BASE=config/baseload

# The added base topic for baseload profiles:
MQTT_CONFIG_WALLBOX_BASE=config/wallbox

# The added base topic for baseload profiles:
MQTT_CONFIG_EV_BASE=config/ev

# The added base topic for charging session log:
MQTT_SESSIONS_BASE=sessions

# The name of the meter for HA:
MQTT_METER_NAME=Home Power Meter

# The added base topic to publish meter (external or internal) data:
MQTT_METER_BASE=meter

# The added base topic for wallbox[es] status and current session
MQTT_WALLBOX_BASE=wallbox

# The added base topic for ev[s] status
MQTT_EV_BASE=ev

# By default this OCPP/MQTT server will publish information
# only in JSON format. If you specify a subtopic postfix in the following
# parameter, also single values will be published
#MQTT_SINGLE_VALUES=_values

# Publishing intervals, in seconds. The status interval is used
# for ocpp/wallbox status and meter data (both house power meter and
# energy data for the current session).
# This value is the *minimum* interval, since usually the wallbox returns
# meter data at a predefined interval (usually 30 seconds).
MQTT_STATUS_INTERVAL=10
MQTT_METER_INTERVAL=2
MQTT_HEARTBEAT_INTERVAL=300


# Home Assistant integration by Auto-discovery:
HA_DISCOVERY_ENABLED=1
HA_DISCOVERY_PREFIX=homeassistant


######## GRID METER ############
# External power meter, if not provided by the wallbox.
# For Shelly EM:
METER_MQTT_PREFIX=shellies/MYSHELLYEM/emeter/0

# For Silla Prism Solar:
#METER_MQTT_PREFIX=home/prism/energy_data

# Subtopics to retrieve meter data. If the subtopic contains a dot ("."), 
# if means that JSON encoded string is used and the field specified
# will be get for the specified data.

# Power, should be espressed in Watt. Use the (optional) multiplier
# to make the needed unit conversion.
# Without phase indicator, it is the overall power.
#METER_MQTT_POWER_MULTIPLIER=1
# For Shelly EM:
METER_MQTT_POWER=power
# For Silla Prism Solar:
#METER_MQTT_POWER=power_grid

#METER_MQTT_L1_POWER=
#METER_MQTT_L2_POWER=
#METER_MQTT_L3_POWER=

# Voltage, should be espressed in Volt. Use the (optional) multiplier
# to make the needed unit conversion.
# You can specify up to 3 voltage, 1 for each phase.
# In single-phase system, comment L2/L3 or set empty string
# If not specified, the voltage of the wallbox will be used
# for increase/decrease wallbox current
#METER_MQTT_VOLTAGE_MULTIPLIER=1
# For Shelly EM:
METER_MQTT_L1_VOLTAGE=voltage
#METER_MQTT_L2_VOLTAGE=
#METER_MQTT_L3_VOLTAGE=

# Current, should be espressed in Ampere. Use the (optional) multiplier
# to make the needed unit conversion.
# You can specify up to 3 voltage, 1 for each phase.
# In single-phase system, comment L2/L3 or set empty string.
# If not specified, it will be calculated by POWER/VOLTAGE
#METER_MQTT_CURRENT_MULTIPLIER=1
# For Shelly EM:
#METER_MQTT_L1_CURRENT=current
#METER_MQTT_L2_CURRENT=
#METER_MQTT_L3_CURRENT=


######## SOLAR GENERATION PARAMTERS ############
# If you have Solar Photovoltaic and you want to show information, fill
# here the topic prefix:
PV_MQTT_PREFIX=photovoltaic

# Set automatically power to 0 after the following timeout (e.g: the
# inverter shuts down and do not update MQTT):
PV_MQTT_TIMEOUT=120

# If the subtopic contains data is in JSON format, you can specified the field
# with a point, e.g.: solar.power

# Instant AC power, expressed in Watt. Use multiplier if expressed
# in different unit (e.g. for kW use 1000):
#PV_MQTT_POWER_MULTIPLIER=1
PV_MQTT_POWER=power

# To have AC voltage traced:
#PV_MQTT_VOLTAGE_MULTIPLIER=1
PV_MQTT_VOLTAGE=voltage

# To have AC current traced:
#PV_MQTT_CURRENT_MULTIPLIER=1
PV_MQTT_CURRENT=current

# To have AC frequency traced:
#PV_MQTT_FREQUENCY_MULTIPLIER=1
PV_MQTT_FREQUENCY=frequency

# Energy, in Wh:
#PV_MQTT_ENERGY_MULTIPLIER=1
PV_MQTT_ENERGY=energy

# To have PV efficiency traced:
#PV_MQTT_FREQUENCY_MULTIPLIER=1
PV_MQTT_EFFICIENCY=efficiency

# Temperature, in deg C:
#PV_MQTT_TEMPERATURE_MULTIPLIER=1
PV_MQTT_TEMPERATURE=temperature

# Humidity, in %:
#PV_MQTT_HUMIDITY_MULTIPLIER=1
PV_MQTT_HUMIDITY=humidity


######## GRID/HOME ENERGY PARAMTERS ############
# If you have this data, it could be useful to have daily statistics.
# If you don't have this data, energy will be integrated from power.
# Since energy data could come from different sources, you have to
# specify full topic (json fields allowed).
# Energy should be in Wh, use *_MULTIPLIER to adjust.
#GRID_MQTT_IMPORT_MULTIPLIER=1
GRID_MQTT_IMPORT=grid/import

#GRID_MQTT_EXPORT_MULTIPLIER=1
GRID_MQTT_EXPORT=grid/export

#HOME_MQTT_ENERGY_MULTIPLIER=1
HOME_MQTT_ENERGY=grid/home

# Set the following parameter to 1 if the HOME energy counter
# include wallbox energy, otherwise set as 0.
HOME_INCLUDE_WALLBOX=1


######## WALLBOX PARAMTERS ############
# Actually this OCPP/MQTT server can handle only 1 wallbox.
# Put anyway wallbox parameter in a dedicated section to facilitate
# future multi-wallbox handling.

[wallbox01]
# Used to identify the wallbox for (future) multi-wallbox handling:
#WALLBOX_SN=

# The main step to increase/decrease current.
# Maybe you can raise/decrease a little bit if WALLBOX_SET_LIMIT_UNIT=W
# to match the real current increase.
WALLBOX_SET_LIMIT_MAINSTEP=1

# The minimum step of the current limit (e.g. 0.01), used by both OCPP and MQTT:
#WALLBOX_SET_LIMIT_FINESTEP=0.1

# Choose the unit to set profile limit (accepted: A, W, kW)
WALLBOX_SET_LIMIT_UNIT=A

# If you set USE_STOP_AS_SUSPEND, you can choose to set 0 A/W limit to avoid
# unintended transaction start.
WALLBOX_SET_LIMIT_ZERO_ON_STOP=1

# Add the following current to the minimum when set profile if you use W/kW as unit (default 1):
WALLBOX_SET_LIMIT_MINADD=0

# If the voltage reported by wallbox is wrong, use the one provided by the meter.
# Specify the maximum percentage deviation (e.g. 5 =~ 11 V on European 230 V grid):
WALLBOX_USE_METER_VOLTAGE=0

# The number of phases wallbox can accept, comma separated.
#WALLBOX_NPHASES=1,3
# The switch phase up/down is the maximum current (inclusive) before
# switching to the next number of phases and the minimun current (inclusive)
# before switching to the previous number of phases.
# By default, both switch up and down are the number of next phases multiplied
# by MINPOWER (the current in multi-phases system is the sum of the phases'
# current).
#WALLBOX_CURRENT_SWITCH_PHASE_UP=18,
#WALLBOX_CURRENT_SWITCH_PHASE_DOWN=,18

# The subtopic used to publish wallbox information/sessions
WALLBOX_MQTT_BASE=wallbox01

# The subtopic used to publish wallbox information/sessions
WALLBOX_MQTT_NAME=MyWallbox

# Number of connectors, by default 1. If more than 1, the connector
# ID (1, 2, 3, etc...) will be added to WALLBOX_MQTT_BASE
#WALLBOX_CONNECTORS=1

# The subtopic to be used if your wallbox has more than 1 connector
#WALLBOX_MQTT_CONNECTOR1_BASE=1
#WALLBOX_MQTT_CONNECTOR2_BASE=2
#WALLBOX_MQTT_CONNECTOR3_BASE=3
#WALLBOX_MQTT_CONNECTOR4_BASE=4

# Base subtopic to send commands to the wallbox from external
# automation:
WALLBOX_MQTT_CMD_BASE=cmd

# If the wallbox does not implement OCPP or is missing SmartCharging
# profile, but it provide information by MQTT, you can specify here
# the various data:
# For Silla Prism Solar:
#WALLBOX_MQTT_GET_BASE=home/prism

#WALLBOX_MQTT_GET_CONNECTOR1_BASE=1
#WALLBOX_MQTT_GET_CONNECTOR2_BASE=2

# Status of the wallbox. For Silla Prism, the values could be: 
# idle, waiting, charging, pause
#WALLBOX_MQTT_GET_STATUS=state

# Power, in Watt:
#WALLBOX_MQTT_GET_POWER_MULTIPLIER=1
#WALLBOX_MQTT_GET_POWER=w

# Voltage, in Volt:
#WALLBOX_MQTT_GET_VOLTAGE_MULTIPLIER=1
#WALLBOX_MQTT_GET_VOLTAGE=volt

# Current, in Ampere:
#WALLBOX_MQTT_GET_CURRENT_MULTIPLIER=0.001
#WALLBOX_MQTT_GET_CURRENT=amp

# Actual current offered by Control Pilot PWM, in Ampere:
#WALLBOX_MQTT_GET_OFFERED_MULTIPLIER=1
#WALLBOX_MQTT_GET_OFFERED=pilot

# Session time, in seconds:
#WALLBOX_MQTT_GET_TIME_MULTIPLIER=1
#WALLBOX_MQTT_GET_TIME=session_time

# Energy delivered in the current session, in Wh:
#WALLBOX_MQTT_GET_ENERGY_MULTIPLIER=1
#WALLBOX_MQTT_GET_ENERGY=wh

# Energy globally delivered by the wallbox, in Wh:
#WALLBOX_MQTT_GET_ENERGY_MULTIPLIER=1
#WALLBOX_MQTT_GET_GLOBAL_ENERGY=wh_total

# Error code:
#WALLBOX_MQTT_GET_ERROR=error

# Delivery mode. For Silla Prism Solar, 1=Solar, 2=Normal, 3=Pause, 4=Suspended by balancing
#WALLBOX_MQTT_GET_MODE=mode

# To change the delivery mode (values as previous parameter, except 4)
WALLBOX_MQTT_SET_MODE=command/set_mode

# To set current limit for custom load balancing (same as OCPP SetChargingProfile):
#WALLBOX_MQTT_SET_LIMIT=command/set_current_limit

# If the wallbox give a feedback of set commands, specify here the subtopic
# base. If empty, the connector base will be taken as base subtopic:
#WALLBOX_MQTT_RESULT_BASE=commandresult

# Result of set_mode command:
#WALLBOX_MQTT_SET_MODE_RESULT_SUCCESS=set_mode/success
#WALLBOX_MQTT_SET_MODE_RESULT_ERROR=set_mode/error
# Set current limit results:
#WALLBOX_MQTT_SET_LIMIT_RESULT_SUCCESS=set_current_limit/success
#WALLBOX_MQTT_SET_LIMIT_RESULT_ERROR=set_current_limit/error


