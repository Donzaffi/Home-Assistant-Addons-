######## PROFILE PARAMETERS #############
# If TIME not specified, all day. Could be specified more than once, e.g.
# for off-peak (place weekday after "@"):
# TIME=00:00-08:00,19:00-24:00@1-5
# TIME=00:00-24:00@0,6
# TIME=23:00-07:00
##
# If YEARDAY not specified, all days (0=Jan 1st, 365/366=Dec 31st)
##
# If WEEKDAY not specified, all days (0=Sunday, 6=Saturday) or the day
# specified in the TIME parameter[s]
##
# If not specified, power expressed in A (otherwise add W)
##
# If FIXED is specified, immediately set that power limit and let WallBox 
# to regulate current based on other loads.
# Italian OpenMeter 2.0 allows always 10% more (e.g. 3kW base load allows
# 3.3kW unlimited time), 33% more (e.g. 4kW) for 3 hours, and more than 33%
# for 2 minutes. You have to place at least a pause of 15 minutes under +10%
# (e.g. <3.3kW) to reset the 10%-33% overload 3-hours counter.
#
# if FIXED=0, immediately suspend.

[HA-SUSPEND]
ENABLE=SUSPEND
WAIT_CHANGE=0
TIME=00:00-24:00
FIXED=0

[HA-FIXED]
# Profile with fixed current
ENABLE=FIXED
TIME=00:00-24:00
FIXED=25

[HA-POWER]
# Profile with fixed power
ENABLE=POWER
TIME=00:00-24:00
FIXED=3000W

[HA-DYNAMIC-ARERA]
# This is for Arera 6.05 / 7.33 kW free power increase
TIME=23-7@1-6,0-24@0
ENABLE=DYNAMIC
MAXPOWER_SUSPEND=7100W
MAXPOWER_REDUCE=7250W
MINPOWER_START=5800W
MINPOWER_INCREASE=7000W

[HA-DYNAMIC]
# This profile should be customized base on your grid limit. 
# By default, this setting are valid for 3 kW Italian Open Meter
ENABLE=DYNAMIC
MAXPOWER_SUSPEND=3800W
MAXPOWER_REDUCE=3950W
MINPOWER_START=2500W
MINPOWER_INCREASE=3700W

[HA-ECO]
# MAXPOWER_SUSPEND and MAXPOWER_START should be customized base on your grid limit. 
# By default, this setting are valid for 3 kW Italian Open Meter
ENABLE=ECO
MAXPOWER_SUSPEND=3800W
MINPOWER_START=2500W
# Try to get maximum from solar, allow a little bit usage of grid
# power before reducing
MAXPOWER_REDUCE=120W
MINPOWER_INCREASE=-150W

[HA-SOLAR]
ENABLE=SOLAR
#For summer: from about Mar 22nd/23rd to Sep 23/24th 
YEARDAY=80-266
MAXPOWER_SUSPEND=0W
MAXPOWER_REDUCE=-30W
MINPOWER_START=-1400W
MINPOWER_INCREASE=-300W
NO_AVERAGE=2

[HA-SOLAR-MEDIUM]
ENABLE=SOLAR
#For spring and autumn: from Feb 10th to Oct 27/28th 
YEARDAY=40-300
MAXPOWER_SUSPEND=500W
MAXPOWER_REDUCE=120W
MINPOWER_START=-930W
MINPOWER_INCREASE=-200W
NO_AVERAGE=2

[HA-SOLAR-WINTER]
# Get maximum from solar, allowing fetch from grid
ENABLE=SOLAR
TIME=00:00-24:00
MAXPOWER_SUSPEND=1250W
MAXPOWER_REDUCE=250W
MINPOWER_START=-250W
MINPOWER_INCREASE=-50W
AVG_CHANGING_SEC=900
NO_AVERAGE=1

[immediately-suspend]
ENABLE=0
WAIT_CHANGE=0
TIME=00:00-24:00
FIXED=0

[fixed-12A]
ENABLE=0
TIME=00:00-24:00
FIXED=12

[fixed-32A]
ENABLE=0
TIME=00:00-24:00
FIXED=32

###############################################
# The following profiles should be used if your
# Wallbox does not support SmartCharging.
###############################################
[nosmart-F3charging]
ENABLE=0
TIME=23:00-07:00@1-6
TIME=00:00-24:00@0
FIXED=12

[nosmart-F23charging]
ENABLE=0
TIME=19:00-08:00@1-5
TIME=00:00-24:00@0,6
FIXED=12

[nosmart-F123charging]
ENABLE=0
TIME=00:00-24:00
FIXED=12


###############################################
# The following profiles could be used if your
# Wallbox supports SmartCharging and has a grid
# power meter.
###############################################
[arera6kw]
# Set grid limit for Arera sperimentation
ENABLE=0
#ENABLE=1
TIME=23:00-07:00@1-6
TIME=00:00-24:00@0
GRID_LIMIT=7333
GRID_LIMIT_SAFE=6050

[F3-6kW]
#Off-peak charging to 7.33kW for 3 hours max, then pause 15 minutes to 6kW
ENABLE=0
#ENABLE=F123,F23,F3
TIME=23:00-07:00@1-6
TIME=00:00-24:00@0
#FIXED=32 # Could be used instead of MAX/MIN power limits
#Set limits a little bit lower (-33W) to be safer
MAXPOWER_SUSPEND=7100W
MAXPOWER_REDUCE=7250W
MINPOWER_START=5800W
MINPOWER_INCREASE=7000W

[F3-6kW-safe]
#Off-peak charging to 6.05kW (unlimited time)
ENABLE=0
#ENABLE=F123,F23,F3
TIME=23:00-07:00@1-6
TIME=00:00-24:00@0
MAXPOWER_SUSPEND=5850W
MAXPOWER_REDUCE=6050W
MINPOWER_START=4500W
MINPOWER_INCREASE=5800W

[chargegrid3k]
#Charge always to 4.0kW for max 3 hours (use default grid limits)
#ENABLE=1
ENABLE=F123
TIME=00:00-24:00
#FIXED=32
MAXPOWER_SUSPEND=3800W
MAXPOWER_REDUCE=3950W
MINPOWER_START=2500W
MINPOWER_INCREASE=3700W

[chargegridsafe3k]
#Charge always limited to 3.3kW (unlimited time)
ENABLE=0
#ENABLE=F123
TIME=00:00-24:00
MAXPOWER_SUSPEND=3100W
MAXPOWER_REDUCE=3300W
MINPOWER_START=2000W
MINPOWER_INCREASE=3050W

[chargegrid4.5k]
#Charge always to 6.0kW for max 3 hours (use default grid limits)
ENABLE=0
#ENABLE=F123
TIME=00:00-24:00
#FIXED=32
MAXPOWER_SUSPEND=5800W
MAXPOWER_REDUCE=5950W
MINPOWER_START=4500W
MINPOWER_INCREASE=5700W

[chargegridsafe4.5k]
#Charge always limited to 4.95kW (unlimited time)
ENABLE=0
#ENABLE=F123
TIME=00:00-24:00
MAXPOWER_SUSPEND=4750W
MAXPOWER_REDUCE=4950W
MINPOWER_START=3400W
MINPOWER_INCREASE=4700W

[F23-charge]
#Mid&Off-peak charging limited to 4kW for 3 hours max
ENABLE=F23
TIME=19:00-08:00@1-5
TIME=00:00-24:00@0,6
#FIXED=32
MAXPOWER_SUSPEND=3800W
MAXPOWER_REDUCE=3950W
MINPOWER_START=2500W
MINPOWER_INCREASE=3700W

[F3-charge-4kW]
#Off-peak charging limited to 4kW for 3 hours max
ENABLE=F3
TIME=23:00-07:00@1-6
TIME=00:00-24:00@0
#FIXED=32
MAXPOWER_SUSPEND=3800W
MAXPOWER_REDUCE=3950W
MINPOWER_START=2500W
MINPOWER_INCREASE=3700W

[Low-grid-load-F3]
# Charge when the Grid Load is low, to help grid balancing
ENABLE=SMART
TIME=00:00-05:00@1-5
TIME=01:00-06:00@6
TIME=00:00-16:00@0
# The following could be used instead of MAX/MIN power limits
FIXED=32 
# To be used with Arera F3 (7.33kW max)
#MAXPOWER_SUSPEND=7100W
#MAXPOWER_REDUCE=7250W
#MINPOWER_START=5800W
#MINPOWER_INCREASE=7000W
# To be used without Arera F3 (4kW max)
#MAXPOWER_SUSPEND=3800W
#MAXPOWER_REDUCE=3950W
#MINPOWER_START=2500W
#MINPOWER_INCREASE=3700W

[Low-grid-load-solar]
# Charge when the Grid Load is low and sun is shining
ENABLE=SMART
TIME=11:30-14:30@1-5
TIME=11:00-15:00@6
#FIXED=32
MAXPOWER_SUSPEND=3800W
MAXPOWER_REDUCE=3950W
MINPOWER_START=-5
MINPOWER_INCREASE=3700W

[solar-F12]
# If F23 or F3 are enabled, charge with solar-only power
# in F1/F2.
ENABLE=F23,F3
MAXPOWER_SUSPEND=0.5
MAXPOWER_REDUCE=-0.5
MINPOWER_START=-6.2
MINPOWER_INCREASE=-2.1

[solar-summer]
ENABLE=CSOLAR,SMART
TIME=05:30-22:00
#From about Apr 10st (~26kWh) to Aug 27th (~26kWh)
YEARDAY=100-240
#From about Mar 22nd/23rd (~22kWh) to Sep 23/24th (~22kWh)
YEARDAY=80-266
MAXPOWER_SUSPEND=0W
MAXPOWER_REDUCE=-30W
MINPOWER_START=-1300W
MINPOWER_INCREASE=-300W
#Do not use average for increase/decrease (1=increase, 2=decrease, 3=both)
NO_AVERAGE=2

[solar-medium]
ENABLE=CSOLAR,SMART
TIME=06:30-21:00
#From about March 1st (~18kWh) to Oct 6th (~18kWh)
#YEARDAY=60-280
#From Feb 10th (~13kWh) to Oct 27/28th (~13kWh)
YEARDAY=40-300
MAXPOWER_SUSPEND=500W
MAXPOWER_REDUCE=120W
MINPOWER_START=-930W
MINPOWER_INCREASE=-200W
#Do not use average for increase/decrease (1=increase, 2=decrease, 3=both)
NO_AVERAGE=2

[solar-winter-max]
ENABLE=CSOLAR,SMART
#ENABLE=0
TIME=07:00-20:00

MAXPOWER_SUSPEND=1850W
MAXPOWER_REDUCE=250W
MINPOWER_START=-250W
MINPOWER_INCREASE=-50W
CHARGING_MINPOWER=9

AVG_CHANGING_SEC=900
NO_AVERAGE=1

[solar-winter]
ENABLE=CSOLAR,SMART
TIME=08:00-19:00
#Try to get maximum from solar-only energy. The minimum power 
#from EVSE specification is 6A, and in Winter only a very brief
#period will allow to charge with only solar energy, so set
#the suspend limit to 4A (~900W of power fetched from grid)

MAXPOWER_SUSPEND=870W
MAXPOWER_REDUCE=230W
MINPOWER_START=-570W
MINPOWER_INCREASE=-140W

AVG_CHANGING_SEC=900
NO_AVERAGE=1

[nightly-suspend]
ENABLE=1
TIME=00:00-24:00
FIXED=0

# In case you don't have a meter, set here manually baseload (e.g: when the
# washing machine is active):

[baseload-washing]
ENABLE=0
TIME=23:00-02:00
BASELOAD=2500

[baseload-night]
ENABLE=0
TIME=23:00-07:00
BASELOAD=1000

[baseload-evening]
ENABLE=0
TIME=18:00-22:00
BASELOAD=3000

[baseload-sunday]
ENABLE=0
TIME=10:00-14:00@0
BASELOAD=3000

